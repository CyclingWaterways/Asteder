<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Åsteder — Success Map</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.27/esri/themes/light/main.css">
    <script src="https://js.arcgis.com/4.27/"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    height: 100%; height: 100dvh;
    overflow: hidden;
    font-family: 'Source Sans 3', system-ui, sans-serif;
    background: #F4EDE4;
    -webkit-font-smoothing: antialiased;
}
:root {
    --color-forest: #1B3A2D;
    --color-sage: #7A9E7E;
    --color-sage-light: #B5CDB6;
    --color-sand: #F4EDE4;
    --color-sand-dark: #E8DFD3;
    --color-water: #D4622A;
    --color-water-light: #F0C4A8;
    --color-text: #2D2A26;
    --color-text-secondary: #6B6560;
    --color-white: #FEFDFB;
    --color-accent: #C85A3A;
    --font-display: 'DM Serif Display', Georgia, serif;
    --panel-height: 33vh;
    --radius-sm: 6px;
    --radius-md: 12px;
    --shadow-up: 0 -4px 20px rgba(27,58,45,0.12);
    --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

#viewDiv { position: fixed; inset: 0; }

#loading {
    position: fixed; inset: 0;
    background: var(--color-sand);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; transition: opacity 0.6s;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.loader-ring {
    width: 32px; height: 32px;
    border: 2.5px solid var(--color-sand-dark);
    border-top-color: var(--color-forest);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.esri-popup { display: none !important; }

/* PANEL */
#dataPanel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--panel-height);
    min-height: 300px;
    background: var(--color-white);
    border-top: 1px solid var(--color-sand-dark);
    box-shadow: var(--shadow-up);
    z-index: 990;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform var(--transition-smooth);
}
#dataPanel.visible { transform: translateY(0); }

/* Title bar */
.panel-bar {
    display: flex;
    align-items: center;
    padding: 0 16px;
    height: 56px;
    flex-shrink: 0;
    gap: 14px;
    border-bottom: 1px solid var(--color-sand-dark);
}
.panel-icon {
    width: 36px; height: 36px;
    background: var(--color-forest);
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
}
.panel-icon svg { width: 16px; height: 16px; color: var(--color-sage); }
.panel-info { flex: 1; min-width: 0; }
#episodeTitle {
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--color-forest);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
}
.close-btn {
    width: 32px; height: 32px;
    border: 1px solid var(--color-sand-dark);
    background: var(--color-white);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition-fast);
    color: var(--color-text-secondary);
}
.close-btn:hover { background: var(--color-sand); color: var(--color-accent); }
.close-btn svg { width: 16px; height: 16px; }

/* Content */
.panel-content {
    flex: 1;
    display: flex;
    overflow: hidden;
}

/* Left — downloads + % */
.downloads-block {
    width: 140px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--color-sand-dark);
    gap: 2px;
    padding: 12px;
}
.downloads-number {
    font-family: var(--font-display);
    font-size: 42px;
    line-height: 1;
    color: var(--color-forest);
}
.downloads-unit {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
    margin-bottom: 8px;
}
.pct-badge {
    background: var(--color-sand);
    border: 1px solid var(--color-sand-dark);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-water);
}
.bars-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 16px 20px;
    gap: 16px;
}
.bar-group { display: flex; flex-direction: column; gap: 6px; }
.bar-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
}
.bar-label-text {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-secondary);
}
.bar-label-value {
    font-size: 11px;
    font-weight: 600;
    color: var(--color-forest);
}
.bar-track {
    height: 8px;
    background: var(--color-sand-dark);
    border-radius: 4px;
    overflow: hidden;
}
.bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}
.bar-fill.cumulative { background: var(--color-forest); }

/* River timeline — variable size dots */
.river-timeline {
    position: relative;
    height: 32px;
    display: flex;
    align-items: center;
}
.river-timeline::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%; transform: translateY(-50%);
    height: 2px;
    background: var(--color-sand-dark);
    border-radius: 1px;
}
.river-dot-wrap {
    position: absolute;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1;
}
.river-dot {
    border-radius: 50%;
    background: var(--color-water);
    border: none;
    transition: background 0.3s ease, box-shadow 0.3s ease;
    flex-shrink: 0;
}
.river-dot.top3 {
    background: var(--color-water);
    box-shadow: 0 0 0 3px rgba(212,98,42,0.25), 0 0 0 5px rgba(212,98,42,0.12);
}
.river-dot.visited {
    background: var(--color-water);
    opacity: 0.5;
}
.river-dot.active {
    background: var(--color-forest);
    box-shadow: 0 0 0 3px rgba(27,58,45,0.25);
}
.river-dot.top3.active {
    background: var(--color-forest);
    box-shadow: 0 0 0 3px rgba(27,58,45,0.3), 0 0 0 6px rgba(27,58,45,0.12);
}

/* Nav */
.panel-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-top: 1px solid var(--color-sand-dark);
    flex-shrink: 0;
}
.panel-counter {
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
    letter-spacing: 0.04em;
}
.panel-nav-btns { display: flex; gap: 6px; }
.panel-nav-btn {
    width: 32px; height: 32px;
    border: 1px solid var(--color-sand-dark);
    background: var(--color-white);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition-fast);
    color: var(--color-text);
}
.panel-nav-btn:hover:not(:disabled) { background: var(--color-sand); border-color: var(--color-sage-light); }
.panel-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.panel-nav-btn svg { width: 16px; height: 16px; }

/* Celebration animation */
@keyframes celebrate {
    0%   { box-shadow: 0 0 0 0 rgba(27,58,45,0.6); }
    50%  { box-shadow: 0 0 0 12px rgba(27,58,45,0); }
    100% { box-shadow: 0 0 0 0 rgba(27,58,45,0); }
}
.bar-fill.cumulative.complete {
    animation: celebrate 0.6s ease-out 0.7s 3;
}

.esri-ui-corner { margin: 10px; }
.esri-widget--button { border-radius: var(--radius-sm) !important; }
    </style>
</head>
<body>

<div id="loading"><div class="loader-ring"></div></div>
<div id="viewDiv"></div>

<div id="dataPanel">
    <div class="panel-bar">
        <div class="panel-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
                <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
            </svg>
        </div>
        <div class="panel-info">
            <span id="episodeTitle">Select an episode</span>
        </div>
        <button class="close-btn" onclick="closePanel()" title="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <div class="panel-content">
        <div class="downloads-block">
            <div class="downloads-number" id="episodeDownloads">—</div>
            <div class="downloads-unit">downloads</div>
            <div class="pct-badge" id="episodePct">—%</div>
        </div>
        <div class="bars-block">
            <div class="bar-group">
                <div class="bar-label">
                    <span class="bar-label-text">Cumulative · episodes 1 to <span id="cumulLabel">1</span></span>
                    <span class="bar-label-value" id="cumulValue">0</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill cumulative" id="cumulFill" style="width:0%"></div>
                </div>
                <div class="bar-label" style="margin-top:2px">
                    <span class="bar-label-text">Total · 20 episodes</span>
                    <span class="bar-label-value">75,900</span>
                </div>
            </div>
            <div class="bar-group">
                <div class="bar-label">
                    <span class="bar-label-text">Tinnet Krat</span>
                    <span class="bar-label-text">Randers Fjord</span>
                </div>
                <div class="river-timeline" id="riverTimeline"></div>
            </div>
        </div>
    </div>

    <div class="panel-nav">
        <span class="panel-counter" id="panelCounter"></span>
        <div class="panel-nav-btns">
            <button class="panel-nav-btn" id="prevBtn" onclick="navigatePrevious()" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="panel-nav-btn" id="nextBtn" onclick="navigateNext()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
const TOTAL_DOWNLOADS = 75900;
let realTotal = 0; // calculated from actual data
let minDl = Infinity;
let maxDl = 0;
let allEpisodes = [];
let currentIdx = -1;
let mapView = null;
let podcastLayer = null;
let tooltipLayer = null;
let highlightHandle = null;
let GraphicClass = null;

function getDownloads(attrs) {
    const raw = attrs.downloads || '';
    if (!raw) return 0;
    const num = parseFloat(raw.replace('t', ''));
    return isNaN(num) ? 0 : Math.round(num * 1000);
}

function getCumulative(upToIdx) {
    let sum = 0;
    for (let i = 0; i <= upToIdx; i++) {
        if (allEpisodes[i]) sum += getDownloads(allEpisodes[i].attributes);
    }
    return sum;
}
function buildTimeline(total) {
    const container = document.getElementById('riverTimeline');
    container.innerHTML = '';

    // Calculate proportional sizes
    const downloads = allEpisodes.map(f => getDownloads(f.attributes));
    const minD = Math.min(...downloads);
    const maxD = Math.max(...downloads);
    const range = maxD - minD || 1;

    // Find top 3 indices by downloads
    const sorted = [...downloads].map((d, i) => ({ d, i })).sort((a, b) => b.d - a.d);
    const top3 = new Set(sorted.slice(0, 3).map(x => x.i));

    for (let i = 0; i < total; i++) {
        const dl = downloads[i] || 0;
        // Map to 5–10px diameter for normal dots
        const size = Math.round(5 + ((dl - minD) / range) * 5);
        const isTop = top3.has(i);

        const wrapper = document.createElement('div');
        wrapper.className = 'river-dot-wrap';
        wrapper.style.left = (i / (total - 1) * 100) + '%';
        wrapper.style.width = size + 'px';
        wrapper.style.height = size + 'px';

        const dot = document.createElement('div');
        dot.className = 'river-dot' + (isTop ? ' top3' : '');
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';

        const name = allEpisodes[i] ? (allEpisodes[i].attributes.name || '').replace(/\s*\(#\d+\)\s*$/, '').trim() : '';
        wrapper.title = name;
        wrapper.addEventListener('click', () => selectEpisode(i));
        wrapper.appendChild(dot);
        container.appendChild(wrapper);
    }
}

function updateTimeline(activeIdx) {
    document.querySelectorAll('.river-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === activeIdx);
        dot.classList.toggle('visited', i < activeIdx);
    });
}
function showPanel(attrs, idx) {
    const fullName = attrs.name || 'Episode';
    const displayName = fullName.replace(/\s*\(#\d+\)\s*$/, '').trim();
    const dl = getDownloads(attrs);
    const total = realTotal > 0 ? realTotal : TOTAL_DOWNLOADS;
    const pct = ((dl / total) * 100).toFixed(1);
    const cumul = getCumulative(idx);
    const cumulPct = Math.min((cumul / total) * 100, 100).toFixed(1);
    const id = attrs.ID || attrs.id || (idx + 1);
    const isLast = (idx === allEpisodes.length - 1);

    document.getElementById('episodeTitle').textContent = displayName;
    document.getElementById('episodeDownloads').textContent = dl.toLocaleString('en-GB');
    document.getElementById('episodePct').textContent = pct + '%';
    document.getElementById('cumulLabel').textContent = idx + 1;
    document.getElementById('cumulValue').textContent = cumul.toLocaleString('en-GB');

    const fill = document.getElementById('cumulFill');
    fill.classList.remove('complete');
    fill.style.width = cumulPct + '%';
    if (isLast) setTimeout(() => fill.classList.add('complete'), 750);

    document.getElementById('panelCounter').textContent = id + ' / ' + allEpisodes.length;
    document.getElementById('prevBtn').disabled = (idx === 0);
    document.getElementById('nextBtn').disabled = (idx === allEpisodes.length - 1);
    updateTimeline(idx);

    document.getElementById('dataPanel').classList.add('visible');
    setTimeout(updateMapPadding, 450);
}

function updateMapPadding() {
    if (!mapView) return;
    const panel = document.getElementById('dataPanel');
    mapView.padding = { bottom: panel.classList.contains('visible') ? panel.offsetHeight : 0 };
}

function closePanel() {
    document.getElementById('dataPanel').classList.remove('visible');
    if (tooltipLayer) tooltipLayer.removeAll();
    if (highlightHandle) { highlightHandle.remove(); highlightHandle = null; }
    currentIdx = -1;
    updateMapPadding();
    if (podcastLayer && mapView) {
        const q = podcastLayer.createQuery();
        q.where = '1=1';
        podcastLayer.queryExtent(q).then(r => {
            if (r.extent) mapView.goTo(r.extent.expand(1.2), { duration: 600 });
        });
    }
}

function selectEpisode(idx) {
    if (idx < 0 || idx >= allEpisodes.length) return;
    currentIdx = idx;
    const feature = allEpisodes[idx];
    const attrs = feature.attributes;

    showPanel(attrs, idx);

    if (tooltipLayer && GraphicClass) {
        tooltipLayer.removeAll();
        const name = (attrs.name || '').replace(/\s*\(#\d+\)\s*$/, '').trim();
        const dl = getDownloads(attrs);
        // Proportional size: map downloads range to 14–44px
        const range = maxDl - minDl || 1;
        const size = Math.round(14 + ((dl - minDl) / range) * 30);
        tooltipLayer.add(new GraphicClass({
            geometry: feature.geometry,
            symbol: { type: 'simple-marker', color: [212,98,42,0.25], size: size, outline: { color: [212,98,42,0.9], width: 2 } }
        }));
        tooltipLayer.add(new GraphicClass({
            geometry: feature.geometry,
            symbol: { type: 'text', color: '#1B3A2D', text: name,
                font: { size: 11, weight: 'bold', family: 'Source Sans 3, sans-serif' },
                haloColor: 'white', haloSize: 2, yoffset: -(size / 2 + 8) }
        }));
    }

    if (highlightHandle) highlightHandle.remove();
    if (mapView && podcastLayer) {
        mapView.whenLayerView(podcastLayer).then(lv => { highlightHandle = lv.highlight(feature); });
    }

    setTimeout(() => {
        updateMapPadding();
        if (mapView) mapView.goTo({ target: feature.geometry, zoom: 12 }, { duration: 700 });
    }, 450);
}

function navigatePrevious() { if (currentIdx > 0) selectEpisode(currentIdx - 1); }
function navigateNext() { if (currentIdx < allEpisodes.length - 1) selectEpisode(currentIdx + 1); }

require([
    "esri/WebMap", "esri/views/MapView", "esri/widgets/ScaleBar",
    "esri/Graphic", "esri/layers/GraphicsLayer"
], function(WebMap, MapView, ScaleBar, Graphic, GraphicsLayer) {
    GraphicClass = Graphic;
    const webmap = new WebMap({ portalItem: { id: "28cbdfd16ee14463b5e537e734c63b4f" } });
    const view = new MapView({ container: "viewDiv", map: webmap, constraints: { minZoom: 8, maxZoom: 16 } });
    mapView = view;

    view.when(() => {
        const loader = document.getElementById('loading');
        loader.classList.add('hidden');
        setTimeout(() => loader.style.display = 'none', 700);

        tooltipLayer = new GraphicsLayer();
        webmap.add(tooltipLayer);

        webmap.layers.forEach(l => {
            if (l.title && l.title.toLowerCase().includes('podcast')) podcastLayer = l;
        });

        if (podcastLayer) {
            podcastLayer.popupEnabled = false;
            const q = podcastLayer.createQuery();
            q.where = '1=1'; q.outFields = ['*']; q.orderByFields = ['ID ASC'];
            podcastLayer.queryFeatures(q).then(r => {
                allEpisodes = r.features;
                // Calculate real total and min/max for proportional symbols
                realTotal = 0;
                minDl = Infinity;
                maxDl = 0;
                allEpisodes.forEach(f => {
                    const dl = getDownloads(f.attributes);
                    realTotal += dl;
                    if (dl < minDl) minDl = dl;
                    if (dl > maxDl) maxDl = dl;
                });
                buildTimeline(allEpisodes.length);
                if (allEpisodes.length) selectEpisode(0);
            });
        }

        view.ui.move("zoom", "top-right");
        view.ui.add(new ScaleBar({ view, unit: 'metric' }), 'bottom-left');
    });

    view.on('click', e => {
        view.hitTest(e).then(r => {
            if (!r.results.length) return;
            const g = r.results[0].graphic;
            if (g.layer !== podcastLayer) return;
            const fid = g.attributes.fid || g.attributes.FID || g.attributes.OBJECTID;
            const idx = allEpisodes.findIndex(f =>
                (f.attributes.fid || f.attributes.FID || f.attributes.OBJECTID) === fid
            );
            if (idx !== -1) selectEpisode(idx);
        });
    });

    view.on('pointer-move', e => {
        view.hitTest(e).then(r => {
            view.container.style.cursor =
                r.results.length && r.results[0].graphic.layer === podcastLayer ? 'pointer' : '';
        });
    });
});
</script>
</body>
</html>
