<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Åsteder — Problem Map</title>
    <link rel="stylesheet" href="https://js.arcgis.com/4.27/esri/themes/light/main.css">
    <script src="https://js.arcgis.com/4.27/"></script>
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; height: 100dvh; overflow: hidden; }

#viewDiv { position: fixed; inset: 0; }

#loading {
    position: fixed; inset: 0;
    background: #F4EDE4;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; transition: opacity 0.6s;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.loader-ring {
    width: 32px; height: 32px;
    border: 2.5px solid #E8DFD3;
    border-top-color: #1B3A2D;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.esri-popup { display: none !important; }
.esri-ui-corner { margin: 10px; }
.esri-widget--button { border-radius: 6px !important; }
    </style>
</head>
<body>

<div id="loading"><div class="loader-ring"></div></div>
<div id="viewDiv"></div>

<script>
require([
    "esri/WebMap", "esri/views/MapView", "esri/widgets/ScaleBar"
], function(WebMap, MapView, ScaleBar) {

    const webmap = new WebMap({ portalItem: { id: "28cbdfd16ee14463b5e537e734c63b4f" } });
    const view = new MapView({
        container: "viewDiv",
        map: webmap,
        constraints: { minZoom: 8, maxZoom: 16 }
    });

    view.when(() => {
        const loader = document.getElementById('loading');
        loader.classList.add('hidden');
        setTimeout(() => loader.style.display = 'none', 700);

        // Hide podcast layer
        webmap.layers.forEach(l => {
            if (l.title && l.title.toLowerCase().includes('podcast')) {
                l.visible = false;
            }
        });

        view.ui.move("zoom", "top-right");
        view.ui.add(new ScaleBar({ view, unit: 'metric' }), 'bottom-left');
    });
});
</script>
</body>
</html>
